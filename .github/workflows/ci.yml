name: ci

on:
  push:
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # The validator's own tests, then every plugin and skill against the Agent Skills spec and the plugin layout.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm test
      - run: npm run validate
